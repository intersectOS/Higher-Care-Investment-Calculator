<style>
/* Layout: one column of file cards, a sticky live split monitor on top, and a full-screen report sheet */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --ink:#0F2A2E; --muted:#56706F; --line:#D3DFDD;
  --co:#0D4F54; --co-soft:#D9EAE9; --team:#956F24; --team-soft:#F3EBD8; --ok:#2E7D4F; --warn:#A8541A;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1718; --surface:#132325; --ink:#E4EFEE; --muted:#93AEAC; --line:#24393B;
  --co:#4FB7B4; --co-soft:#173B3D; --team:#D4AE5E; --team-soft:#362C17; --ok:#5CC487; --warn:#E8945A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1718; --surface:#132325; --ink:#E4EFEE; --muted:#93AEAC; --line:#24393B;
  --co:#4FB7B4; --co-soft:#173B3D; --team:#D4AE5E; --team-soft:#362C17; --ok:#5CC487; --warn:#E8945A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;direction:rtl;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 0}
.wrap{max-width:880px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.35}
h1{font-size:1.7rem} h2{font-size:1.15rem} h3{font-size:1rem}
.eyebrow{font-size:.78rem;color:var(--muted);letter-spacing:.02em}
p{margin:0}
.lead{color:var(--muted);max-width:64ch}
header{display:flex;flex-direction:column;gap:6px;padding-top:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:46px;height:auto}
.sheet .rlogo{width:64px;height:auto;display:block;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px}
.projrow{display:flex;gap:8px;flex-wrap:wrap}
.projrow select{flex:1 1 220px;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.cloud{font-size:.8rem;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.cloud::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.cloud.ok::before{background:var(--ok)} .cloud.busy::before{background:var(--team)} .cloud.bad{color:var(--warn)} .cloud.bad::before{background:var(--warn)}
.btn[disabled]{opacity:.55;cursor:default}
.numwrap{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-display);color:var(--co)}
.numin{width:5.2rem!important;padding:3px 8px!important;text-align:center;font-family:var(--f-display);color:var(--co)!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{font:inherit;font-size:.86rem;border:none;background:var(--bg);color:var(--muted);padding:8px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--co);color:var(--surface)}
.manual-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;border-top:1px dashed var(--line);padding-top:10px}
.manual-grid .field label{font-size:.8rem}
.bar span.t.tbd{background:repeating-linear-gradient(135deg,var(--line) 0 7px,var(--bg) 7px 14px);color:var(--muted)}
.brand-mark{width:46px;height:auto}
.sheet .rlogo{width:64px;height:auto;display:block;margin-bottom:6px}
.monitor{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 20px -14px rgba(0,0,0,.35)}
.mrow{display:grid;grid-template-columns:5.5rem 1fr;align-items:center;gap:10px}
.mrow .lbl{font-size:.8rem;color:var(--muted)}
.bar{display:flex;height:26px;border-radius:7px;overflow:hidden;background:var(--line);font-size:.78rem;font-weight:600;font-variant-numeric:tabular-nums}
.bar span{display:flex;align-items:center;justify-content:center;white-space:nowrap;transition:width .35s ease;min-width:0;overflow:hidden}
.bar .c{background:var(--co);color:var(--surface)}
.bar .t{background:var(--team);color:var(--surface)}
.legend{display:flex;gap:16px;font-size:.78rem;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend .sp{flex:1}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.sec-head{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.step{font-family:var(--f-display);color:var(--co);font-size:.85rem}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.preset{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:10px 12px;text-align:right;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.preset b{font-family:var(--f-display);font-size:.95rem}
.preset small{color:var(--muted);font-size:.78rem;line-height:1.5}
.preset[aria-pressed="true"]{border-color:var(--co);background:var(--co-soft)}
:focus-visible{outline:2px solid var(--co);outline-offset:2px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.86rem;font-weight:500;display:flex;justify-content:space-between;gap:8px}
.field label output{font-family:var(--f-display);color:var(--co);font-variant-numeric:tabular-nums}
.hint{font-size:.78rem;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--co)}
input[type=number],input[type=text],textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
textarea{resize:vertical;min-height:64px;line-height:1.6}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.person{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.person.owner{border-color:var(--team)}
.person.company{border-color:var(--co)}
.person-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.74rem;padding:2px 10px;border-radius:999px;background:var(--team-soft);color:var(--team);font-weight:600}
.tag.co{background:var(--co-soft);color:var(--co)}
.person input,.person textarea{background:var(--surface)}
.shares{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.shares b{font-family:var(--f-display);color:var(--ink);font-variant-numeric:tabular-nums}
.btn{font:inherit;font-size:.86rem;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:7px 14px;cursor:pointer}
.btn.del{border:none;background:none;color:var(--muted);padding:4px 8px}
.btn.primary{background:var(--co);color:var(--surface);border-color:var(--co)}
.btn.team{background:var(--team);color:var(--surface);border-color:var(--team)}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.9rem}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}
th{font-size:.78rem;color:var(--muted);font-weight:500}
td.num{font-family:var(--f-display);white-space:nowrap}
.note{font-size:.84rem;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.note b{color:var(--ink)}
.pie-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.stat .k{font-size:.78rem;color:var(--muted)}
.stat.co .v{color:var(--co)} .stat.tm .v{color:var(--team)}
.flag{font-size:.84rem;padding:8px 12px;border-radius:8px;border-inline-start:4px solid var(--ok);background:var(--bg)}
.flag.warn{border-color:var(--warn)}
.checks{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.checks li{display:flex;gap:8px;align-items:center}
.checks input[type=checkbox]{accent-color:var(--co);width:18px;height:18px;flex:none}
.vest{display:flex;gap:2px;height:34px;align-items:flex-end}
.vest i{flex:1;background:var(--line);border-radius:2px 2px 0 0;transition:height .2s,background .2s}
.vest i.on{background:var(--team)}
.vest-axis{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.practice{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.practice div{border-top:3px solid var(--co);padding-top:8px;display:flex;flex-direction:column;gap:2px}
.practice b{font-family:var(--f-display);font-size:1.1rem}
.practice span{font-size:.82rem;color:var(--muted)}
.reports{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.rcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.rcard p{font-size:.84rem;color:var(--muted)}
footer{margin-top:10px;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));text-align:center;font-size:.8rem;color:var(--muted);border-top:1px solid var(--line)}

/* Report sheet */
.report{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.rtools{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rtools .row{max-width:820px;margin:0 auto}
.rtools .msg{font-size:.8rem;color:var(--muted)}
.sheet{max-width:820px;margin:18px auto 40px;background:var(--surface);border:1px solid var(--line);border-radius:6px;
  padding:32px max(20px,4vw);display:flex;flex-direction:column;gap:22px}
.sheet-wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--co);padding-bottom:14px}
.sheet .rhead.partner{border-color:var(--team)}
.sheet .rkind{font-size:.78rem;color:var(--muted)}
.sheet .meta{font-size:.82rem;color:var(--muted);text-align:left;font-variant-numeric:tabular-nums}
.sheet section{display:flex;flex-direction:column;gap:10px}
.sheet h2{font-size:1.05rem;color:var(--co)}
.sheet .rhead.partner + * h2,.sheet.partner h2{color:var(--team)}
.sheet ul{margin:0;padding-inline-start:20px}
.sheet .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sheet .kpi{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.sheet .kpi b{display:block;font-family:var(--f-display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.sheet .kpi span{font-size:.78rem;color:var(--muted)}
.sheet .tasks{white-space:pre-line;font-size:.86rem}
.sheet .sign{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px;margin-top:8px}
.sheet .sign div{border-top:1px solid var(--ink);padding-top:6px;font-size:.84rem}
.sheet .credit{font-size:.76rem;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:12px}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;padding:0;color:#000}
  .wrap,.rtools{display:none!important}
  .report{position:static;overflow:visible;background:#fff}
  .sheet{border:none;margin:0;padding:0;max-width:none}
  .sheet section{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){.bar span,.vest i{transition:none}}
</style>
</head>
<body>
<style>
/* Gate: brand ivory stage, logo assembles from particles, password field beneath */
.gate{--g-bg:#FAF8F3;--g-teal:#0D4F54;--g-gold:#B08A3A;--g-muted:#6B7F7E;--g-line:#DCD6C8;
  position:fixed;inset:0;z-index:100;background:var(--g-bg);color:var(--g-teal);display:flex;align-items:center;justify-content:center;overflow:hidden;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-family:var(--f-body);direction:rtl;transition:opacity .8s ease,visibility .8s;color-scheme:light}
.gate.out{opacity:0;visibility:hidden}
.gate canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.gate-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;width:100%;max-width:400px;text-align:center}
.logo-stage{perspective:800px;cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:20px;outline-offset:6px}
.logo-stage:focus-visible{outline:2px solid var(--g-gold)}
.logo{width:min(230px,56vw);aspect-ratio:308/270;max-width:100%;transition:transform .3s ease-out;position:relative}
.logo img{width:100%;height:100%;display:block;opacity:0;transition:opacity .5s ease}
.logo.formed img{opacity:1}
.logo.beat{animation:beat .7s ease-out}
.wordmark{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;transform:translateY(12px);transition:opacity .8s ease,transform .8s ease}
.wordmark.show{opacity:1;transform:none}
.wordmark b{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.2;color:var(--g-teal)}
.wordmark .en{font-size:.74rem;letter-spacing:.36em;color:var(--g-teal);direction:ltr;font-weight:600}
.wordmark .wm-tag{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--g-gold);margin-top:4px}
.wordmark .wm-tag::before,.wordmark .wm-tag::after{content:"";width:34px;height:1px;background:var(--g-gold)}
.lock{width:100%;display:flex;flex-direction:column;gap:10px;opacity:0;transform:translateY(12px);transition:opacity .7s ease .15s,transform .7s ease .15s}
.lock.show{opacity:1;transform:none}
.lock label{font-size:.84rem;color:var(--g-muted)}
.lock-row{display:flex;gap:8px}
.lock input{flex:1;min-width:0;font:inherit;font-size:1rem;color:var(--g-teal);background:#fff;border:1px solid var(--g-line);border-radius:10px;padding:11px 14px;direction:ltr;text-align:left}
.lock input:focus-visible{outline:2px solid var(--g-teal);outline-offset:2px}
.lock button{font:inherit;font-weight:600;background:var(--g-teal);color:#fff;border:none;border-radius:10px;padding:0 22px;cursor:pointer}
.lock button:focus-visible{outline:2px solid var(--g-gold);outline-offset:2px}
.lock button[disabled]{opacity:.6;cursor:wait}
.lock .err{min-height:1.4em;font-size:.84rem;color:#A4462A;margin:0}
.lock.shake{animation:shake .4s}
.gate-hint{font-size:.74rem;color:var(--g-muted);margin:0}
.gate-credit{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:16px;right:16px;text-align:center;font-size:.72rem;color:var(--g-muted);margin:0}
@keyframes beat{0%{transform:scale(1)}25%{transform:scale(1.07)}50%{transform:scale(.98)}70%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){
  .logo img{opacity:1;transition:none}.wordmark,.lock{opacity:1;transform:none;transition:none}
  .logo,.logo.beat,.lock.shake{animation:none;transition:none}
}
@media print{.gate{display:none!important}}
</style>

    gate.addEventListener('pointerleave',function(){logo.style.transform=''});
  }

  size(); addEventListener('resize',function(){size(); if(phase!=='idle'){cx.clearRect(0,0,W,H); phase='idle'; logo.classList.add('formed');}});
  function start(){ if(reduce){done();return;} setTimeout(function(){form(false)},250); }
  if(img.complete&&img.naturalWidth) start(); else img.addEventListener('load',start);

  /* ---------- decrypt and mount ---------- */
  function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
  async function unlock(pw){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:P.i,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    var buf=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.v)},key,b64(P.c));
    return JSON.parse(new TextDecoder().decode(buf));
  }
  /* sign in to Supabase with the same password; fall back to local mode */
  function signIn(sb,pw){
    if(!sb){window.__SB={offline:true,reason:'none'};return Promise.resolve();}
    return fetch(sb.url+'/auth/v1/token?grant_type=password',{method:'POST',
      headers:{'apikey':sb.key,'Content-Type':'application/json'},body:JSON.stringify({email:sb.email,password:pw})})
    .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
    .then(function(res){
      if(res.ok&&res.j.access_token){
        window.__SB={url:sb.url,key:sb.key,token:res.j.access_token,refresh:res.j.refresh_token,exp:Date.now()+(res.j.expires_in||3600)*1000};
      } else window.__SB={offline:true,reason:'auth'};
    })
    .catch(function(){window.__SB={offline:true,reason:'network'};});
  }
  function mount(app){
    $('appRoot').innerHTML=app.html;
    var s=document.createElement('script'); s.textContent=app.js; document.body.appendChild(s);
    gate.classList.add('out');
    setTimeout(function(){alive=false; cancelAnimationFrame(raf); gate.hidden=true;},850);
  }
  var form_=$('lockForm'), err=$('pwErr'), btn=$('pwBtn');
  form_.addEventListener('submit',function(e){
    e.preventDefault(); err.textContent='';
    if(!window.crypto||!crypto.subtle){err.textContent='افتح الصفحة عبر رابط https حتى يعمل الدخول.';return;}
    btn.disabled=true;
    var pwv=$('pw').value;
    unlock(pwv).then(function(app){
      beat(); btn.textContent='جارٍ الاتصال…';
      return signIn(app.sb,pwv).then(function(){setTimeout(function(){mount(app)},reduce?0:300);});
    })
    .catch(function(){
      btn.disabled=false; err.textContent='كلمة السر غير صحيحة. تأكد من الأحرف الكبيرة والرموز.';
      form_.classList.remove('shake'); void form_.offsetWidth; form_.classList.add('shake'); $('pw').select();
    });
  });
})();
</script>
